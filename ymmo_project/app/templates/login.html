{% extends 'base.html' %}

{% block title %}Connexion - Ymmo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 fw-bold text-dark">Connexion Intra-Ymmo</h2>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse Email</label>
                        <input type="email" name="email" class="form-control" id="email" required placeholder="ex: jean@ymmo.fr">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg">Se connecter</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
